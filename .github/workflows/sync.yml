name: sync-and-publish

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Encrypted database + Garmin session from the previous run (ciphertext only).
      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Sync Garmin and build the encrypted site
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python -m server.export --out site

      - name: Save encrypted state
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
