<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Garmin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Mi Garmin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <form id="login-form">
    <div class="logo">▲</div>
    <h1>Mi Garmin</h1>
    <p>Datos cifrados · acceso privado</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" required>
    <button id="login-btn" type="submit">Entrar</button>
    <div id="login-err" class="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div>
      <h1 id="title">Resumen</h1>
      <div id="sync" class="muted"></div>
    </div>
    <button id="refresh" class="icon" aria-label="Sincronizar ahora">⟳</button>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="home" class="on"><span>◔</span>Resumen</button>
    <button data-tab="acts"><span>≡</span>Actividades</button>
    <button data-tab="health"><span>♥</span>Salud</button>
  </nav>
</div>

<div id="detail" hidden>
  <header class="sub"><button id="back" class="icon" aria-label="Volver">‹</button><h1 id="d-title"></h1></header>
  <div id="d-body"></div>
</div>
<script src="app.js"></script>
</body>
</html>
